<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickLaunch 正在启动软件...</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: rgba(15, 23, 42, 0.1);
      --text: #0f172a;
      --muted: #64748b;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --danger: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f111a;
        --card: #1a1d2b;
        --border: rgba(255, 255, 255, 0.1);
        --text: #f1f5f9;
        --muted: #94a3b8;
        --accent: #6366f1;
        --accent-hover: #818cf8;
        --danger: #f87171;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
    }
    .icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 14px;
      border-radius: 13px;
      background: linear-gradient(135deg, #3b82f6, #7c3aed);
      color: #fff;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 17px;
      font-weight: 600;
    }
    .url-box {
      margin: 10px 0 14px;
      padding: 8px 12px;
      border-radius: 9px;
      background: rgba(100, 116, 139, 0.12);
      color: var(--muted);
      font-family: Consolas, Monaco, monospace;
      font-size: 12px;
      word-break: break-all;
    }
    .desc {
      margin: 0 0 18px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.55;
    }
    .desc.is-error {
      color: var(--danger);
    }
    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .btn {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      padding: 8px 16px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .btn.primary:hover {
      background: var(--accent-hover);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⚡</div>
    <h1 id="title">正在启动本地应用...</h1>
    <div id="urlBox" class="url-box"></div>
    <p id="status" class="desc">
      如果浏览器弹出确认提示，请勾选“始终允许”后点击打开，以后全站均可免确认直达。
    </p>
    <div class="actions">
      <button id="retryBtn" class="btn primary" type="button">重新拉起</button>
      <button id="markKnownBtn" class="btn" type="button" style="display:none">已勾选，以后自动关</button>
      <button id="pauseBtn" class="btn" type="button" style="display:none">暂停关闭</button>
      <button id="closeBtn" class="btn" type="button">关闭此页</button>
    </div>
  </div>
  <script src="../shared/protocol.js"></script>
  <script src="../shared/store.js"></script>
  <script src="./launch.js"></script>
</body>
</html>
