name: Test & Build Extension

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run automated tests
        run: node --test tests/*.test.mjs

      - name: Build Chrome/Edge and Firefox packages
        run: node scripts/build.mjs

      - name: Verify ZIP archives
        run: |
          unzip -t dist/quicklaunch-dock-chrome-edge.zip
          unzip -t dist/quicklaunch-dock-firefox.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quicklaunch-dock-packages
          path: |
            dist/quicklaunch-dock-chrome-edge.zip
            dist/quicklaunch-dock-firefox.zip

      - name: Publish GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/quicklaunch-dock-chrome-edge.zip
            dist/quicklaunch-dock-firefox.zip
          generate_release_notes: true
