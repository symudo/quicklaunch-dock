<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickLaunch Dock</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
    }
    body.is-tab-page {
      min-height: 100vh;
      overflow: auto;
      background: #f1f5f9;
    }
    @media (prefers-color-scheme: dark) {
      body.is-tab-page[data-theme="auto"] {
        background: #0f111a;
      }
    }
    body.is-tab-page[data-theme="dark"] {
      background: #0f111a;
    }
  </style>
</head>
<body>
  <div id="app" class="ql-root" data-theme="auto"></div>
  <script src="../shared/protocol.js"></script>
  <script src="../shared/reg-parser.js"></script>
  <script src="../shared/store.js"></script>
  <script src="../shared/styles.js"></script>
  <script src="../shared/panel.js"></script>
  <script src="./popup.js"></script>
</body>
</html>
